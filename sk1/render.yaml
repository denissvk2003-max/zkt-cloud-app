# Render Blueprint – automaticky vytvorí všetky cloudové služby
# frontend, backend a PostgreSQL databázu

services:
# Backend služba – Flask API v Docker kontajneri
  - type: web
    name: denisnotes-backend
    runtime: docker
    rootDir: sk1/backend
    region: frankfurt
    plan: free
    envVars:
      # DATABASE_URL sa automaticky vezme z Render PostgreSQL databázy
      - key: DATABASE_URL
        fromDatabase:
          name: denisnotes-db
          property: connectionString

    # Frontend služba – nginx web server v Docker kontajneri
  - type: web
    name: denisnotes-frontend
    runtime: docker
    rootDir: sk1/frontend
    region: frankfurt
    plan: free
    envVars:
      # URL backendu použitá pre komunikáciu frontendu s API
      - key: BACKEND_URL
        value: https://denisnotes-backend.onrender.com

databases:
  # PostgreSQL databáza pre ukladanie poznámok
  - name: denisnotes-db
    databaseName: notesdb
    user: notesuser
    region: frankfurt
    plan: free