<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <title>Cloud Notes App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 850px;
            margin: 40px auto;
            padding: 20px;
            background: #f3f6fb;
        }

        .box {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 0 12px rgba(0,0,0,0.12);
        }

        h1 {
            margin-top: 0;
            color: #1f2937;
        }

        input {
            width: 70%;
            padding: 10px;
        }

        button {
            padding: 10px 18px;
            cursor: pointer;
        }

        li {
            background: #eef2ff;
            margin: 8px 0;
            padding: 10px;
            border-radius: 6px;
        }

        .small {
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>
<div class="box">
    <h1>Cloud Notes App</h1>
    <p class="small">Webová aplikácia nasadená do verejného cloudu Azure.</p>

    <input type="text" id="noteInput" placeholder="Zadaj poznámku">
    <button onclick="addNote()">Pridať</button>

    <h2>Zoznam poznámok</h2>
    <ul id="notesList"></ul>
</div>

<script>
    const apiUrl = "/api/notes";

    async function loadNotes() {
        const response = await fetch(apiUrl);
        const notes = await response.json();

        const list = document.getElementById("notesList");
        list.innerHTML = "";

        notes.forEach(note => {
            const li = document.createElement("li");
            li.textContent = `${note.id}: ${note.content}`;
            list.appendChild(li);
        });
    }

    async function addNote() {
        const input = document.getElementById("noteInput");
        const content = input.value.trim();

        if (!content) {
            alert("Zadaj poznámku.");
            return;
        }

        await fetch(apiUrl, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({content})
        });

        input.value = "";
        loadNotes();
    }

    loadNotes();
</script>
</body>
</html>
