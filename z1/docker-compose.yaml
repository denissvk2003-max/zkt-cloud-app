services:
  db:
    image: postgres:16
    container_name: zkt_db
    restart: always
    environment:
      POSTGRES_DB: notesdb
      POSTGRES_USER: notesuser
      POSTGRES_PASSWORD: notessecret
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - app_net
    expose:
      - "5432"

  backend:
    build: ./backend
    container_name: zkt_backend
    restart: always
    environment:
      DB_HOST: db
      DB_NAME: notesdb
      DB_USER: notesuser
      DB_PASSWORD: notessecret
      DB_PORT: 5432
    depends_on:
      - db
    networks:
      - app_net
    expose:
      - "5000"

  frontend:
    image: nginx:alpine
    container_name: zkt_frontend
    restart: always
    depends_on:
      - backend
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./frontend/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    networks:
      - app_net

  adminer:
    image: adminer:latest
    container_name: zkt_adminer
    restart: always
    depends_on:
      - db
    ports:
      - "8081:8080"
    networks:
      - app_net

volumes:
  db_data:
    name: zkt_db_data

networks:
  app_net:
    name: zkt_app_net