<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZKT Docker App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background: #f5f5f5;
        }

        h1 {
            color: #222;
        }

        .box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 8px rgba(0,0,0,0.1);
        }

        input {
            width: 70%;
            padding: 10px;
            margin-right: 10px;
        }

        button {
            padding: 10px 16px;
            cursor: pointer;
        }

        ul {
            margin-top: 20px;
            padding-left: 20px;
        }

        li {
            background: #e9e9e9;
            margin: 8px 0;
            padding: 10px;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>Docker Notes App</h1>
        <p>Jednoduchá webová aplikácia nasadená pomocou Docker Compose.</p>

        <input type="text" id="noteInput" placeholder="Zadaj poznámku">
        <button onclick="addNote()">Pridať</button>

        <h2>Zoznam poznámok</h2>
        <ul id="notesList"></ul>
    </div>

    <script>
        const apiUrl = "/api/notes";

        async function loadNotes() {
            const response = await fetch(apiUrl);
            const notes = await response.json();

            const list = document.getElementById("notesList");
            list.innerHTML = "";

            notes.forEach(note => {
                const li = document.createElement("li");
                li.textContent = `${note.id}: ${note.content}`;
                list.appendChild(li);
            });
        }

        async function addNote() {
            const input = document.getElementById("noteInput");
            const content = input.value.trim();

            if (!content) {
                alert("Zadaj text poznámky.");
                return;
            }

            await fetch(apiUrl, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ content: content })
            });

            input.value = "";
            loadNotes();
        }

        loadNotes();
    </script>
</body>
</html>
